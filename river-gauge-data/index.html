<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>USGS River Data</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f7f7fb;
            color: #222;
        }

        h1 {
            margin-bottom: 10px;
        }

        #layout {
            display: grid;
            grid-template-columns: minmax(0, 1.2fr) minmax(0, 1.8fr);
            gap: 24px;
            align-items: flex-start;
        }

        #riverData {
            margin-top: 10px;
        }

        .reading {
            background: #ffffff;
            padding: 12px 14px;
            margin-bottom: 10px;
            border-radius: 6px;
            border: 1px solid #ddd;
        }

        .reading h3 {
            margin: 0 0 6px;
            font-size: 1.05rem;
        }

        /* --- Added Weather Styling --- */
        .weather-inline { 
            margin-top: 10px; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
        }
        
        .weather-inline img { 
            width: 40px; 
            height: 40px; 
        }

        .null {
            color: #b00;
            font-weight: bold;
        }

        button.show-graph {
            margin-top: 8px;
            padding: 6px 10px;
            border-radius: 4px;
            border: 1px solid #1f6feb;
            background: #1f6feb;
            color: #fff;
            cursor: pointer;
            font-size: 0.9rem;
        }

        button.show-graph:hover {
            background: #174fb3;
        }

        #graphPanel {
            background: #ffffff;
            border-radius: 6px;
            border: 1px solid #ddd;
            padding: 14px 16px;
        }

        #graphTitle {
            margin: 0 0 10px;
            font-size: 1.1rem;
        }

        /* --- FIX: The new dedicated chart wrapper --- */
        .chart-wrapper {
            position: relative;
            height: 350px; /* Forces the graph to be this tall */
            width: 100%;
        }

        @media (max-width: 800px) {
            #layout {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<h1>USGS River Data</h1>
<p>Latest readings and 7‑day gage height graphs for selected Buffalo River sites.</p>

<div id="layout">
    <div>
        <h2>Latest Readings</h2>
        <div id="riverData">Loading river data...</div>
    </div>

    <div id="graphPanel">
        <h2 id="graphTitle">Select a site to view its 7‑day graph</h2>
        <div class="chart-wrapper">
            <canvas id="riverChart"></canvas>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="js/app.js"></script>
</body>
</html>
